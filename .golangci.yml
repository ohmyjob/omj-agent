version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - misspell
    - staticcheck
  settings:
    errcheck:
      exclude-functions:
        # Command output goes to stdout and stderr; a failed write has nowhere better to be reported.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # Running user-defined commands is the product, so a variable in exec.Command is not a finding.
        - G204
        # The agent only opens files at paths it derives from its own configuration; none comes from a request.
        - G304
        # Field and file names contain the word credential; the secret itself is never a literal.
        - G101
        # Backoff jitter only spreads retries out; it has no security purpose.
        - G404
