name: omj-e2e-harness

services:
    server:
        image: ${OMJ_SERVER_IMAGE:-ohmyjob/server:e2e}
        environment:
            APP_URL: http://server:8080
            # Every Agent long poll holds one thread for its whole wait, so this has
            # to cover both Agents plus whatever the tests ask for at the same time.
            FRANKENPHP_NUM_THREADS: 16
            # The reconcile windows are minutes in production; the suite cannot wait
            # that long, so a Machine falls offline and a Run is declared lost fast.
            OMJ_MACHINE_OFFLINE_AFTER_SECONDS: 30
            OMJ_RUN_LOST_AFTER_SECONDS: 60
            OMJ_ENROLLMENT_TOKEN_TTL_SECONDS: ${OMJ_ENROLLMENT_TOKEN_TTL_SECONDS:-900}
        tmpfs:
            - /data
        ports:
            - '${OMJ_E2E_PORT:-8210}:8080'
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/up']
            interval: 2s
            timeout: 3s
            retries: 30
        networks:
            - omj

    agent-a:
        build:
            context: ../..
            dockerfile: test/e2e/agent.Dockerfile
            args:
                AGENT_VERSION: ${OMJ_AGENT_VERSION:-0.1.0}
        depends_on:
            server:
                condition: service_healthy
        # The Agent is enrolled by the suite, so the container idles until then.
        command: ['sleep', 'infinity']
        networks:
            - omj

    agent-b:
        build:
            context: ../..
            dockerfile: test/e2e/agent.Dockerfile
            args:
                AGENT_VERSION: ${OMJ_AGENT_VERSION:-0.1.0}
        depends_on:
            server:
                condition: service_healthy
        command: ['sleep', 'infinity']
        networks:
            - omj

networks:
    omj:
        name: omj-e2e-harness
