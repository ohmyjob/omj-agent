name: e2e

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        # The suite builds two images and waits on a scheduler tick, so it is slower
        # than the unit gate and runs on its own.
        timeout-minutes: 150

        steps:
            - name: Check out the Agent
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check out the Server
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ohmyjob/omj-server
                  path: server
                  persist-credentials: false
                  token: ${{ secrets.OMJ_SERVER_TOKEN || github.token }}

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            # Both repositories are private, so the published image cannot be pulled here.
            # Building it from the checkout also tests the Server as it stands on that branch.
            - name: Build the Server image
              run: make server-image SERVER_DIR=server

            # Repeat the complete suite on the same runner with fresh harnesses.
            # A failure in any repetition fails the gate; this is not a retry.
            - name: Run the end-to-end suite three consecutive times
              run: make e2e E2E_COUNT=3 E2E_TIMEOUT=135m
