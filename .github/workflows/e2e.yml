name: e2e

on:
    workflow_dispatch:
        inputs:
            repetitions:
                description: Full suite repetitions (three for reliability validation)
                type: choice
                default: '1'
                options:
                    - '1'
                    - '3'

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.repetitions == '3' && 150 || 60 }}

        steps:
            - name: Check out the Agent
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check out the Server
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ohmyjob/omj-server
                  path: server
                  persist-credentials: false
                  token: ${{ secrets.OMJ_SERVER_TOKEN || github.token }}

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            # Both repositories are private, so the published image cannot be pulled here.
            # Building it from the checkout also tests the Server as it stands on that branch.
            - name: Build the Server image
              run: make server-image SERVER_DIR=server

            # Repetitions validate reliability; failures are not retried.
            - name: Run the end-to-end suite
              env:
                  E2E_COUNT: ${{ inputs.repetitions }}
                  E2E_TIMEOUT: ${{ inputs.repetitions == '3' && '135m' || '45m' }}
              run: make e2e
